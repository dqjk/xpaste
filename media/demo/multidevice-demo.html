<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xpaste multi-device demo</title>
    <style>
      :root {
        color: #0f172a;
        background: #f4f7fb;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1280px;
        height: 820px;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 16%, rgba(96, 165, 250, 0.24), transparent 34%),
          radial-gradient(circle at 88% 18%, rgba(45, 212, 191, 0.2), transparent 30%),
          linear-gradient(135deg, #f8fafc 0%, #eef4fb 54%, #f9fafb 100%);
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 42px 58px;
      }

      .headline {
        position: absolute;
        top: 42px;
        left: 58px;
        z-index: 10;
        max-width: 560px;
        animation: fade-up 700ms ease both;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 13px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        color: #2563eb;
        font-size: 16px;
        font-weight: 700;
        box-shadow: 0 16px 42px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 20px 0 12px;
        font-size: 58px;
        line-height: 0.96;
        letter-spacing: -0.055em;
      }

      .subtitle {
        margin: 0;
        color: #475569;
        font-size: 24px;
        line-height: 1.42;
      }

      .device {
        position: absolute;
        overflow: hidden;
        background: #111827;
        box-shadow: 0 26px 80px rgba(15, 23, 42, 0.2);
      }

      .device::before {
        content: attr(data-label);
        position: absolute;
        top: 14px;
        left: 18px;
        z-index: 2;
        padding: 6px 11px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.72);
        color: white;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.01em;
        backdrop-filter: blur(12px);
      }

      .device img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top left;
      }

      .desktop {
        right: 56px;
        bottom: 92px;
        width: 760px;
        height: 475px;
        border: 10px solid #0f172a;
        border-radius: 28px;
        animation: desktop-in 850ms cubic-bezier(0.2, 0.8, 0.2, 1) 180ms both;
      }

      .tablet {
        left: 64px;
        bottom: 48px;
        width: 328px;
        height: 438px;
        border: 12px solid #111827;
        border-radius: 36px;
        animation: device-in 850ms cubic-bezier(0.2, 0.8, 0.2, 1) 900ms both;
      }

      .phone {
        left: 358px;
        bottom: 56px;
        width: 210px;
        height: 454px;
        border: 10px solid #0f172a;
        border-radius: 34px;
        animation: device-in 850ms cubic-bezier(0.2, 0.8, 0.2, 1) 1250ms both;
      }

      .flow {
        position: absolute;
        left: 420px;
        bottom: 300px;
        z-index: 8;
        display: grid;
        gap: 12px;
        animation: fade-up 700ms ease 1850ms both;
      }

      .flow span {
        width: fit-content;
        padding: 12px 15px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.84);
        color: #0f172a;
        font-size: 18px;
        font-weight: 800;
        box-shadow: 0 18px 46px rgba(15, 23, 42, 0.1);
      }

      .footer {
        position: absolute;
        right: 74px;
        bottom: 34px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 22px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        color: #0f172a;
        font-size: 20px;
        font-weight: 900;
        box-shadow: 0 20px 58px rgba(15, 23, 42, 0.12);
        animation: fade-up 700ms ease 2300ms both;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 0 9px rgba(34, 197, 94, 0.14);
      }

      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(18px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes desktop-in {
        from {
          opacity: 0;
          transform: translate(48px, 28px) scale(0.96);
        }

        to {
          opacity: 1;
          transform: translate(0, 0) scale(1);
        }
      }

      @keyframes device-in {
        from {
          opacity: 0;
          transform: translateY(44px) scale(0.94);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="headline">
        <div class="eyebrow">xpaste · LAN Share</div>
        <h1>电脑启动，手机和 iPad 打开网页就能用</h1>
        <p class="subtitle">同一局域网内共享文本、图片和文件，无需账号。</p>
      </section>

      <div class="device desktop" data-label="PC / Mac">
        <img src="./multidevice/desktop.png" alt="xpaste desktop UI" />
      </div>

      <div class="device tablet" data-label="iPad">
        <img src="./multidevice/ipad.png" alt="xpaste iPad UI" />
      </div>

      <div class="device phone" data-label="Phone">
        <img src="./multidevice/phone.png" alt="xpaste phone UI" />
      </div>

      <div class="flow">
        <span>粘贴文本</span>
        <span>上传图片</span>
        <span>保存文件</span>
      </div>

      <div class="footer">
        <span class="dot"></span>
        同一局域网 · 无需账号 · 用完即走
      </div>
    </main>
  </body>
</html>
